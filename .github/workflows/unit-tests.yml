name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Cache driver external dependencies
        uses: ./.github/actions/driver-deps
        with:
          save: "true"

      - name: Run All Unit Tests
        run: |
          set +e
          make test.unit 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/unit-tests.log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          anchors = [index for index, line in enumerate(lines) if re.search(r"--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|error while loading|symbol lookup", line, re.IGNORECASE)]
          for number, index in enumerate(anchors):
              message = "\n".join(lines[max(0, index - 8):min(len(lines), index + 9)])[-3800:]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Unit test failure {number + 1}::{message}")
          PY
          fi
          exit "$status"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
