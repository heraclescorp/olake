name: Go Security CI

on:
  push:
    branches:
      - "master"
    paths: &security-paths
      - '**/*.go'
      - '**/*.java'
      - '**/go.mod'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/pom.xml'
      - '**/.trivyignore'
  pull_request:
    branches:
      - "*"
    paths: *security-paths
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
      - name: Install native build dependencies
        uses: ./.github/actions/driver-deps
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run vulnerability checks
        run: |
          govulncheck ./... >/tmp/govuln.txt 2>&1 || VULN_EXIT=$?
          VULN_EXIT=${VULN_EXIT:-0}
          cat /tmp/govuln.txt

          if [ "$VULN_EXIT" -ne 3 ]; then
            exit "$VULN_EXIT"
          fi

          # Repo root is the job working directory; do not use ../.govulnignore
          IGNORED=$(grep -vE '^\s*(#|$)' .govulnignore 2>/dev/null | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u | paste -s -d '|' -)
          FOUND=$(grep -oE 'GO-[0-9]+-[0-9]+' /tmp/govuln.txt | sort -u)
          UNKNOWN="$FOUND"
          if [ -n "$IGNORED" ]; then
            UNKNOWN=$(echo "$UNKNOWN" | grep -vE "$IGNORED" || true)
          fi

          if [ -n "$UNKNOWN" ]; then
            echo "Unsuppressed vulnerabilities found: $UNKNOWN"
            exit 1
          fi

          echo -e "\033[0;32m✅ govulncheck: all findings suppressed via .govulnignore\033[0m"

  gosec:
    name: GoSec Security Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
      - name: Install native build dependencies
        uses: ./.github/actions/driver-deps
      - name: install gosec
        run: curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.22.11
      - name: Run Gosec Security Scanner
        run: |
          set +e
          $(go env GOPATH)/bin/gosec -exclude=G115 -exclude-dir=tests -severity=high -confidence=medium ./... 2>&1 | tee "$RUNNER_TEMP/gosec.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/gosec.log" <<'PY'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3800:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=GoSec failure details::" + message)
          PY
          fi
          exit "$status"

  trivy-go:
    name: trivy-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run Trivy Go vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          exit-code: '1'
          scan-type: 'fs'
          scan-ref: './'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
